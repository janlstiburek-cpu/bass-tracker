<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>K®NCEPT — Bass Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0a0a0a;
            --surface:  #111111;
            --surface2: #1a1a1a;
            --border:   rgba(255,255,255,0.08);
            --text:     #f0f0f0;
            --text-dim: rgba(240,240,240,0.45);
            --peach:    #f5a46a;
            --pink:     #e879a0;
            --lavender: #c084d8;
            --gradient: linear-gradient(135deg, #f5a46a 0%, #e879a0 50%, #c084d8 100%);
            --done-bg:      rgba(245,164,106,0.15);
            --done-border:  #f5a46a;
            --missed-bg:    rgba(239,68,68,0.12);
            --missed-border:#7f1d1d;
            --off-bg:       rgba(255,255,255,0.04);
            --off-border:   rgba(255,255,255,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Barlow Condensed', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Loading ────────────────────────────── */
        #loading {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; flex-direction: column; gap: 16px;
        }
        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            letter-spacing: 4px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--peach);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Setup ──────────────────────────────── */
        #setup-screen {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 32px 20px;
            background: var(--bg);
        }

        .setup-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 64px;
            letter-spacing: 6px;
            line-height: 1;
            margin-bottom: 4px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .setup-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 6px;
            color: var(--text-dim);
            margin-bottom: 40px;
        }

        .setup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
        }

        .setup-card label {
            display: block;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .setup-card input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            color: var(--text);
            font-size: 14px;
            font-family: 'SF Mono', 'Menlo', monospace;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .setup-card input:focus { outline: none; border-color: var(--peach); }

        .setup-hint {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 24px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 2px solid var(--peach);
        }

        .btn-primary {
            width: 100%;
            background: transparent;
            color: var(--text);
            border: 2px solid var(--text);
            border-radius: 100px;
            padding: 14px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--text); color: var(--bg); }
        .btn-primary:active { opacity: 0.8; }

        /* ── Main ───────────────────────────────── */
        #main-screen { display: none; flex-direction: column; min-height: 100vh; }

        /* ── Header ─────────────────────────────── */
        .header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 16px 14px;
            position: sticky; top: 0; z-index: 10;
        }

        .header-top {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 16px;
        }

        .header-brand {
            display: flex; flex-direction: column; line-height: 1;
        }

        .brand-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-dim);
            margin-top: 1px;
        }

        .btn-icon {
            background: none; border: none;
            color: var(--text-dim); cursor: pointer;
            font-size: 18px; padding: 6px 8px; line-height: 1;
            transition: color 0.2s;
        }
        .btn-icon:hover { color: var(--text); }

        .stats-row { display: flex; gap: 8px; }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            flex: 1; text-align: center;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px; line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .stat-value.peach   { color: var(--peach); }
        .stat-value.pink    { color: var(--pink); }
        .stat-value.lavender{ color: var(--lavender); }

        .stat-label {
            font-size: 9px; color: var(--text-dim);
            margin-top: 3px; text-transform: uppercase;
            letter-spacing: 1px;
        }

        .warning-banner {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 13px;
            color: #fca5a5;
            letter-spacing: 0.3px;
            display: none;
        }

        /* ── Calendar ───────────────────────────── */
        .calendar-container { padding: 16px 16px 0; }

        .month-section { margin-bottom: 28px; }

        .month-header {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 3px;
            color: var(--text-dim);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .weekday-row, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .weekday-row { margin-bottom: 3px; }

        .weekday-label {
            text-align: center;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 3px 0;
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: var(--surface2);
            border: 1px solid transparent;
            transition: transform 0.1s, opacity 0.1s;
            user-select: none; -webkit-user-select: none;
            min-height: 36px;
        }
        .day-cell:active { transform: scale(0.92); }

        .day-cell.empty   { background: transparent; cursor: default; border: none; }
        .day-cell.future  { opacity: 0.25; cursor: default; }
        .day-cell.today   { border-color: var(--peach) !important; opacity: 1; }

        .day-cell.done         { background: var(--done-bg); border-color: var(--done-border); }
        .day-cell.missed       { background: var(--missed-bg); border-color: var(--missed-border); }
        .day-cell.planned-off  { background: var(--off-bg); border-color: var(--off-border); }

        .day-number { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; line-height: 1; }
        .day-minutes { font-size: 9px; color: var(--peach); margin-top: 1px; line-height: 1; }

        .milestone-dot {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--pink);
            position: absolute; top: 3px; right: 3px;
        }

        /* ── Milestones section ─────────────────── */
        .milestones-section {
            margin: 16px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--gradient);
            margin-bottom: 48px;
        }

        .milestones-inner { padding: 20px; }

        .section-heading {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: rgba(0,0,0,0.5);
            margin-bottom: 14px;
        }

        .milestone-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .milestone-pill {
            border: 2px solid rgba(0,0,0,0.6);
            border-radius: 100px;
            padding: 4px 14px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: rgba(0,0,0,0.8);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .milestone-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(0,0,0,0.75);
            line-height: 1.3;
        }

        .milestone-item.past .milestone-pill,
        .milestone-item.past .milestone-label {
            opacity: 0.45;
        }

        .milestone-item.today-ms .milestone-pill {
            background: rgba(0,0,0,0.15);
            border-color: rgba(0,0,0,0.9);
            color: rgba(0,0,0,1);
        }

        /* ── Modal ──────────────────────────────── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); z-index: 100;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 20px 20px 48px;
            width: 100%; max-width: 500px;
        }

        .modal-handle {
            width: 36px; height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .modal-date {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px; letter-spacing: 2px;
            margin-bottom: 18px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-status-row { display: flex; gap: 8px; margin-bottom: 20px; }

        .btn-status {
            flex: 1; padding: 11px 6px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px; letter-spacing: 1px;
            cursor: pointer; text-align: center;
            transition: all 0.15s;
        }
        .btn-status.sel-done   { border-color: var(--peach); color: var(--peach); background: rgba(245,164,106,0.1); }
        .btn-status.sel-missed { border-color: #ef4444; color: #fca5a5; background: rgba(239,68,68,0.1); }
        .btn-status.sel-off    { border-color: rgba(255,255,255,0.3); color: var(--text); background: rgba(255,255,255,0.05); }

        .modal-field { margin-bottom: 16px; }
        .modal-field label {
            display: block; font-size: 10px; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%; background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 11px 14px;
            color: var(--text); font-size: 16px;
            font-family: inherit; transition: border-color 0.2s;
        }
        .modal-field textarea { resize: none; height: 72px; font-size: 14px; }
        .modal-field input:focus,
        .modal-field textarea:focus { outline: none; border-color: var(--peach); }

        .quality-row { display: flex; gap: 6px; }
        .quality-btn {
            flex: 1; padding: 10px 4px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer;
            font-size: 18px; text-align: center;
            transition: all 0.15s;
        }
        .quality-btn.selected {
            border-color: var(--peach);
            background: rgba(245,164,106,0.1);
            transform: scale(1.08);
        }

        .btn-save {
            width: 100%; background: transparent;
            color: var(--text); border: 2px solid var(--text);
            border-radius: 100px; padding: 14px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px; letter-spacing: 3px;
            cursor: pointer; margin-top: 4px;
            transition: all 0.2s;
        }
        .btn-save:hover  { background: var(--text); color: var(--bg); }
        .btn-save:active { opacity: 0.8; }

        /* ── Toast ──────────────────────────────── */
        .toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 100px; padding: 10px 20px;
            font-size: 13px; letter-spacing: 0.5px;
            color: var(--text); z-index: 200;
            transition: transform 0.3s ease; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── Responsive ─────────────────────────── */
        @media (min-width: 480px) {
            .day-cell { min-height: 48px; }
            .day-number { font-size: 13px; }
            .modal { border-radius: 20px; margin: 20px; padding: 24px 24px 32px; }
            .modal-overlay { align-items: center; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
    <div class="loading-logo">K®NCEPT</div>
    <div class="spinner"></div>
</div>

<!-- Setup -->
<div id="setup-screen">
    <div class="setup-logo">K®NCEPT</div>
    <div class="setup-sub">BASS TRACKER</div>

    <div class="setup-card">
        <label>GitHub Personal Access Token</label>
        <input type="password" id="setup-token" placeholder="ghp_…" autocomplete="off" />

        <label>Gist ID <span style="font-weight:400;text-transform:none;letter-spacing:0">(nechej prázdné → vytvoří se automaticky)</span></label>
        <input type="text" id="setup-gist" placeholder="automaticky" autocomplete="off" />

        <div class="setup-hint">
            github.com → Settings → Developer settings → Personal access tokens → Fine-grained<br>
            Oprávnění: <strong>Gist → Read and write</strong>
        </div>

        <button class="btn-primary" onclick="setupApp()">SPUSTIT TRACKER</button>
    </div>
</div>

<!-- Main -->
<div id="main-screen">

    <div class="header">
        <div class="header-top">
            <div class="header-brand">
                <div class="brand-main">K®NCEPT</div>
                <div class="brand-sub">BASS TRACKER</div>
            </div>
            <button class="btn-icon" onclick="showSettings()">⚙️</button>
        </div>
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value peach" id="stat-streak">0</div>
                <div class="stat-label">Řetěz dní</div>
            </div>
            <div class="stat-card">
                <div class="stat-value pink" id="stat-total-days">0</div>
                <div class="stat-label">Dní splněno</div>
            </div>
            <div class="stat-card">
                <div class="stat-value lavender" id="stat-total-hours">0h</div>
                <div class="stat-label">Celkem hodin</div>
            </div>
        </div>
        <div class="warning-banner" id="warning-banner">
            ⚠️ Včera jsi necvičil — <strong>NEVER MISS TWICE.</strong> Dnes to musíš napravit.
        </div>
    </div>

    <div class="calendar-container" id="calendar-container"></div>

    <div class="milestones-section">
        <div class="milestones-inner">
            <div class="section-heading">MILNÍKY</div>
            <div id="milestones-list"></div>
        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-date" id="modal-date-label"></div>

        <div class="modal-status-row">
            <button class="btn-status" id="btn-done"   onclick="setStatus('done')">✅ CVIČIL</button>
            <button class="btn-status" id="btn-missed" onclick="setStatus('missed')">❌ VYNECHAL</button>
            <button class="btn-status" id="btn-off"    onclick="setStatus('planned-off')">⚫ VOLNO</button>
        </div>

        <div id="fields-done">
            <div class="modal-field">
                <label>Čas (minuty)</label>
                <input type="number" id="modal-minutes" placeholder="30" min="1" max="180" inputmode="numeric" />
            </div>
            <div class="modal-field">
                <label>Jak to šlo?</label>
                <div class="quality-row">
                    <button class="quality-btn" onclick="setQuality(1)">😞</button>
                    <button class="quality-btn" onclick="setQuality(2)">😐</button>
                    <button class="quality-btn" onclick="setQuality(3)">😊</button>
                    <button class="quality-btn" onclick="setQuality(4)">💪</button>
                    <button class="quality-btn" onclick="setQuality(5)">🔥</button>
                </div>
            </div>
        </div>

        <div class="modal-field">
            <label>Poznámka <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px">(volitelné)</span></label>
            <textarea id="modal-note" placeholder="Co jsem hrál, jak to šlo…"></textarea>
        </div>

        <button class="btn-save" onclick="saveEntry()">ULOŽIT</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────

const START_DATE = '2026-05-24';
const END_DATE   = '2026-10-31';

const MILESTONES = [
    { date: '2026-05-28', label: 'Jiří Korn — 1. společná zkouška' },
    { date: '2026-06-30', label: 'Červen: tempo-building, první celky' },
    { date: '2026-07-15', label: 'Peak form check — jsi ready?' },
    { date: '2026-09-01', label: 'Finální příprava fáze' },
    { date: '2026-10-01', label: 'Poslední měsíc — udržení formy' },
    { date: '2026-10-16', label: '🎸 PREMIÉRA — Pá 16. 10. 2026, 19:00' },
    { date: '2026-10-17', label: '🎸 2. koncert — So 17. 10. 2026, 19:00' },
    { date: '2026-10-18', label: '🎸 3. koncert — Ne 18. 10. 2026, 15:00' },
];

const WEEKDAYS_CS = ['Po','Út','St','Čt','Pá','So','Ne'];
const MONTHS_CS   = ['Leden','Únor','Březen','Duben','Květen','Červen',
                     'Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];

// ── State ─────────────────────────────────────────────────────────────────────

let ghToken = null, gistId = null;
let appData = { sessions: {} };
let modalDate = null, selStatus = null, selQuality = null, saving = false;

// ── Boot ──────────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', async () => {
    ghToken = localStorage.getItem('gh_token');
    gistId  = localStorage.getItem('gist_id');
    if (!ghToken) { show('loading', false); show('setup-screen', true, 'flex'); return; }
    await loadData();
});

// ── Setup ─────────────────────────────────────────────────────────────────────

async function setupApp() {
    const token = document.getElementById('setup-token').value.trim();
    const gist  = document.getElementById('setup-gist').value.trim();
    if (!token) { toast('Zadej GitHub token'); return; }
    ghToken = token;
    localStorage.setItem('gh_token', token);
    show('setup-screen', false);
    show('loading', true);
    if (gist) {
        gistId = gist; localStorage.setItem('gist_id', gist); await loadData();
    } else {
        await createGist();
    }
}

async function createGist() {
    try {
        const res  = await ghFetch('https://api.github.com/gists', {
            method: 'POST',
            body: JSON.stringify({
                description: 'K®NCEPT Bass Tracker 2026',
                public: false,
                files: { 'bass-tracker.json': { content: JSON.stringify({ sessions: {} }, null, 2) } }
            })
        });
        const data = await res.json();
        gistId = data.id;
        localStorage.setItem('gist_id', gistId);
        renderApp();
    } catch(e) {
        show('loading', false); show('setup-screen', true, 'flex');
        toast('Chyba — zkontroluj token');
    }
}

// ── Data ──────────────────────────────────────────────────────────────────────

async function loadData() {
    try {
        const res  = await ghFetch(`https://api.github.com/gists/${gistId}`);
        const gist = await res.json();
        const raw  = gist.files?.['bass-tracker.json']?.content;
        if (raw) appData = JSON.parse(raw);
    } catch(e) { toast('Nepodařilo se načíst data'); }
    renderApp();
}

async function saveData() {
    if (saving) return; saving = true;
    try {
        await ghFetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            body: JSON.stringify({ files: { 'bass-tracker.json': { content: JSON.stringify(appData, null, 2) } } })
        });
        toast('Uloženo ✓');
    } catch(e) { toast('Chyba při ukládání'); }
    saving = false;
}

function ghFetch(url, opts = {}) {
    return fetch(url, { ...opts, headers: { 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json', ...(opts.headers||{}) } });
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderApp() {
    show('loading', false);
    show('main-screen', true, 'flex');
    updateStats(); renderCalendar(); renderMilestones();
}

function updateStats() {
    const today = todayStr();
    let streak = 0, d = parseDate(today);
    for (let i = 0; i < 300; i++) {
        const s = dateStr(d);
        if (s > today) { d = addDays(d,-1); continue; }
        const st = appData.sessions[s]?.status;
        if (st === 'done' || st === 'planned-off') { streak++; d = addDays(d,-1); } else break;
    }
    const done      = Object.values(appData.sessions).filter(e => e.status === 'done');
    const totalMin  = done.reduce((s,e) => s+(e.minutes||0), 0);
    const totalHrs  = totalMin >= 60 ? `${(totalMin/60).toFixed(1)}h` : `${totalMin}m`;

    document.getElementById('stat-streak').textContent      = streak;
    document.getElementById('stat-total-days').textContent  = done.length;
    document.getElementById('stat-total-hours').textContent = totalHrs;

    const yesterday = dateStr(addDays(parseDate(today),-1));
    const yd = appData.sessions[yesterday];
    const showWarn = yd?.status === 'missed' || (!yd && yesterday >= START_DATE && yesterday < today);
    document.getElementById('warning-banner').style.display = showWarn ? 'block' : 'none';
}

function renderCalendar() {
    const container = document.getElementById('calendar-container');
    container.innerHTML = '';
    const today = todayStr();
    const mSet  = new Set(MILESTONES.map(m => m.date));

    let cur = new Date(parseDate(START_DATE).getFullYear(), parseDate(START_DATE).getMonth(), 1);
    const endD = parseDate(END_DATE);

    while (cur <= endD) {
        const year = cur.getFullYear(), month = cur.getMonth();
        const section = el('div','month-section');

        const hdr = el('div','month-header');
        hdr.textContent = `${MONTHS_CS[month]} ${year}`;
        section.appendChild(hdr);

        const wdRow = el('div','weekday-row');
        WEEKDAYS_CS.forEach(d => { const l=el('div','weekday-label'); l.textContent=d; wdRow.appendChild(l); });
        section.appendChild(wdRow);

        const grid = el('div','days-grid');
        const firstDow = new Date(year, month, 1).getDay();
        const offset   = firstDow === 0 ? 6 : firstDow - 1;
        for (let i=0;i<offset;i++) grid.appendChild(el('div','day-cell empty'));

        const daysInMonth = new Date(year, month+1, 0).getDate();
        for (let day=1; day<=daysInMonth; day++) {
            const dStr  = `${year}-${pad(month+1)}-${pad(day)}`;
            const cell  = el('div','day-cell');
            const entry = appData.sessions[dStr];
            const inRange = dStr >= START_DATE && dStr <= END_DATE;
            const isPast  = dStr < today, isToday = dStr === today, isFuture = dStr > today;

            if (!inRange) { cell.classList.add('empty'); grid.appendChild(cell); continue; }
            if (isToday)  cell.classList.add('today');
            if (isFuture && !isToday) cell.classList.add('future');
            if (entry) cell.classList.add(entry.status);
            else if (isPast) cell.classList.add('missed');
            if (mSet.has(dStr)) { const dot=el('div','milestone-dot'); cell.appendChild(dot); }

            const numEl = el('div','day-number'); numEl.textContent = day; cell.appendChild(numEl);
            if (entry?.status === 'done' && entry.minutes) {
                const m = el('div','day-minutes'); m.textContent = `${entry.minutes}'`; cell.appendChild(m);
            }
            if (!isFuture || isToday) cell.addEventListener('click', () => openModal(dStr));
            grid.appendChild(cell);
        }
        section.appendChild(grid);
        container.appendChild(section);
        cur = new Date(year, month+1, 1);
    }
}

function renderMilestones() {
    const list = document.getElementById('milestones-list');
    list.innerHTML = '';
    const today = todayStr();
    MILESTONES.forEach(m => {
        const item  = el('div','milestone-item');
        const pill  = el('div','milestone-pill');
        const label = el('div','milestone-label');
        pill.textContent  = formatShort(m.date);
        label.textContent = m.label;
        if (m.date < today)  item.classList.add('past');
        if (m.date === today) item.classList.add('today-ms');
        item.appendChild(pill); item.appendChild(label);
        list.appendChild(item);
    });
}

// ── Modal ─────────────────────────────────────────────────────────────────────

function openModal(dStr) {
    modalDate = dStr; selStatus = null; selQuality = null;
    document.getElementById('modal-date-label').textContent = formatFull(dStr);
    document.getElementById('modal-minutes').value = '';
    document.getElementById('modal-note').value    = '';
    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.btn-status').forEach(b => b.className = 'btn-status');

    const entry = appData.sessions[dStr];
    if (entry) {
        setStatus(entry.status);
        if (entry.minutes) document.getElementById('modal-minutes').value = entry.minutes;
        if (entry.note)    document.getElementById('modal-note').value    = entry.note;
        if (entry.quality) setQuality(entry.quality);
    } else {
        document.getElementById('fields-done').style.display = 'none';
    }
    document.getElementById('modal-overlay').classList.add('active');
}

function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

function setStatus(s) {
    selStatus = s;
    document.getElementById('btn-done').className   = 'btn-status' + (s==='done'         ? ' sel-done'  : '');
    document.getElementById('btn-missed').className = 'btn-status' + (s==='missed'       ? ' sel-missed': '');
    document.getElementById('btn-off').className    = 'btn-status' + (s==='planned-off'  ? ' sel-off'   : '');
    document.getElementById('fields-done').style.display = s === 'done' ? 'block' : 'none';
}

function setQuality(q) {
    selQuality = q;
    document.querySelectorAll('.quality-btn').forEach((b,i) => b.classList.toggle('selected', i+1===q));
}

async function saveEntry() {
    if (!selStatus) { toast('Vyber stav'); return; }
    const entry = { status: selStatus };
    if (selStatus === 'done') {
        const mins = parseInt(document.getElementById('modal-minutes').value);
        if (!mins||mins<1) { toast('Zadej počet minut'); return; }
        entry.minutes = mins;
        if (selQuality) entry.quality = selQuality;
    }
    const note = document.getElementById('modal-note').value.trim();
    if (note) entry.note = note;
    appData.sessions[modalDate] = entry;
    closeModal(); renderCalendar(); updateStats();
    await saveData();
}

// ── Settings ──────────────────────────────────────────────────────────────────

function showSettings() {
    const t = prompt('GitHub Token (ponech prázdné pro zachování):');
    if (t === null) return;
    if (t.trim()) { ghToken = t.trim(); localStorage.setItem('gh_token', ghToken); }
    const g = prompt('Gist ID:', gistId || '');
    if (g === null) return;
    if (g.trim() && g.trim() !== gistId) { gistId = g.trim(); localStorage.setItem('gist_id', gistId); loadData(); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────

const pad = n => String(n).padStart(2,'0');
const el  = (tag,cls) => { const e=document.createElement(tag); if(cls) e.className=cls; return e; };
const show = (id,v,d='block') => { document.getElementById(id).style.display = v?d:'none'; };

function todayStr() { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dateStr(d)   { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function formatShort(s) { const [y,m,d]=s.split('-').map(Number); return `${d}.${m}.${y}`; }
function formatFull(s) {
    const days=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
    const d=parseDate(s);
    return `${days[d.getDay()]} ${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;
}

let toastTimer=null;
function toast(msg) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
